name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jobs get read access only, and each one asks for what more it needs. Actions are pinned by
# commit, since a tag can be moved; the comment says which release the commit is.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      # The Node version of the server image (apps/server/Dockerfile).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Known vulnerabilities of high or critical severity in what the app and the server ship
      # fail the run; lesser ones and those of build tools are left to Dependabot (ADR-0109).
      - run: pnpm audit --prod --audit-level high

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tesel/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-results
          path: apps/web/test-results

  # The Android app's test build (apps/mobile, ADR-0124): the web app built for it, in the Android
  # project, signed with the public test key. Each run keeps its APK for two weeks, to install by
  # hand; nothing is published.
  android:
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      # The Gradle wrapper in the repository is a binary: it must be one Gradle released.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tesel/mobile sync
        env:
          TESEL_BUILD: ${{ github.run_number }}
      # Android's lint first: the native code is tried on no phone before a build is published.
      - name: Check and build the APK
        working-directory: apps/mobile/android
        env:
          TESEL_BUILD: ${{ github.run_number }}
        run: ./gradlew --no-daemon lintDebug assembleDebug
      - name: What lint found
        if: always()
        working-directory: apps/mobile/android/app/build/intermediates/lint_intermediate_text_report
        run: cat debug/lintReportDebug/lint-results-debug.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: android-lint
          path: apps/mobile/android/app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tesel-android-${{ github.run_number }}
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  # The web app moved to tesel.eu (ADR-0017). GitHub Pages now only redirects old addresses and
  # retires the old service worker (deploy/pages).
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          mkdir site
          cp deploy/pages/index.html deploy/pages/sw.js site/
          cp deploy/pages/index.html site/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # The server image, with the landing page and the web app (ADR-0049). Every run builds it for
  # amd64 and starts it locked down as on the VPS: it must report healthy and serve the page and
  # the app. This job has the workflow's read access only, so the code of a pull request never
  # runs where a token could publish or sign an image (ADR-0109).
  image:
    needs: [check, e2e]
    runs-on: ubuntu-latest
    # A newer push cancels an older run still in this job. Pull requests have groups of their own.
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # BuildKit, which runs the build, is an image pinned by version and digest (deploy/README.md).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c

      - name: Build for amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64
          build-args: TESEL_BUILD=${{ github.run_number }}
          load: true
          tags: tesel-server:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the image as servers do
        run: |
          docker run --detach --name tesel --publish 127.0.0.1:8080:8080 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            tesel-server:test
          timeout 90 sh -c \
            'until [ "$(docker inspect --format "{{.State.Health.Status}}" tesel)" = healthy ]; do sleep 2; done'
          curl -fsS http://127.0.0.1:8080/healthz
          curl -fsS http://127.0.0.1:8080/ | grep '<html' > /dev/null
          curl -fsS http://127.0.0.1:8080/app/ | grep '<html' > /dev/null
      - name: Server logs
        if: failure()
        run: docker logs tesel

  # After a green push to main, the image is published for amd64 and arm64 (for servers on ARM
  # machines), signed with cosign by this workflow's identity on main and with the run's number,
  # and only then tagged "latest", the tag servers follow, if its commit is still the newest on
  # main. Servers run only images signed so, and none from an older run than the one they run
  # (deploy/vps/update.sh, ADR-0109). This is the only job that can write packages and get the
  # identity token that signs.
  image-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e, image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    # A newer push to main cancels an older run still in this job; an older run that reaches it
    # after a newer one is kept from "latest" below.
    concurrency:
      group: image-publish
      cancel-in-progress: true
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/tesel-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Emulates arm64 for the build. It registers itself in the runner's kernel from a privileged
      # container, whose image is pinned like BuildKit's (deploy/README.md).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish for amd64 and arm64
        id: publish
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: TESEL_BUILD=${{ github.run_number }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # The version servers verify with (deploy/vps/install-cosign.sh).
          cosign-release: v3.1.4
      # The run's number, signed with the image, grows with every run of this workflow: servers
      # read it to refuse an image older than theirs.
      - name: Sign, then tag as latest if still the newest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign sign --yes -a "run=$GITHUB_RUN_NUMBER" -a "sha=$GITHUB_SHA" "$IMAGE@$DIGEST"
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "main is at $head now: $GITHUB_SHA is published, and latest stays as it is."
            exit 0
          fi
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
